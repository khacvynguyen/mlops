[pytest]

makers = 
    unit: marks fast, isolated unit tests (no external services)
    integration: marks tests that require external services (Langfuse, LiteLLM, etc.)

testpaths = tests

python_files = test_*.py *_test.py

log_cli = true
log_cli_level = INFO

filterwarnings = 
    ignore::DeprecationWarning
    ignore::UserWarning

addopts = -v --tb=short